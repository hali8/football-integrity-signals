# Every path here is relative to the working directory, deliberately: it stays
# in step with DBT_PROJECT_DIR/DBT_PROFILES_DIR and _sources.yml's paths. Do
# not make this absolute -- it would let dbt start from any directory and
# _sources.yml would then resolve './data' against the wrong place.
integrity:
  target: dev
  outputs:
    dev: { type: duckdb, path: warehouse/integrity.duckdb, threads: 4 }
