# Every path dbt reads here is relative to the WORKING DIRECTORY, not to this
# file: the duckdb path below, DBT_PROJECT_DIR/DBT_PROFILES_DIR in pixi.toml, and
# the data locations in models/staging/_sources.yml. That is deliberate. Because
# they are all relative together, a wrong working directory fails on this file
# before dbt ever reads a source -- they cannot silently disagree.
#
# Do not "tidy" this into an absolute path. Doing so lets dbt start from any
# directory, at which point _sources.yml resolves './data' against that directory
# instead of the repository root and reads whatever happens to be there.
integrity:
  target: dev
  outputs:
    dev: { type: duckdb, path: warehouse/integrity.duckdb, threads: 4 }
