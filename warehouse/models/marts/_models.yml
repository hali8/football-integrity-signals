version: 2

models:
  - name: fct_player_match_metrics
    description: >
      One row per player-match. A thin slice of four metrics to prove the spine;
      definitions are in the README, and the SQL implements them rather than
      deciding them.
    data_tests:
      - not_empty
      - unique_combination:
          arguments:
            columns: [match_id, player_id]
    columns:
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_matches')
                field: match_id
      - name: player_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_players')
                field: player_id
      - name: position
        description: >
          The player's registered role. Not where they played on the day —
          Wyscout records no per-match position.
        data_tests: [not_null]
      - name: position_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [GK, DF, MD, FW]
      - name: started
        description: True if named in the starting eleven rather than the bench.
      - name: minutes_played
        description: >
          From the lineups and substitutions, capped at the match's own length.
          Null where the substitution is missing upstream and the player has a
          single event, so no window can be inferred — unknown, not zero.
      - name: minutes_are_inferred
        description: >
          True where the window came from the player's own first and last event
          because no substitution was recorded. A lower bound.
      - name: match_has_missing_substitution
        description: >
          True for every player in a match where any substitution is missing.
          The player who was replaced is still credited to full time, so any
          window in that match may be too long.
        data_tests: [not_null]
      - name: regulation_minutes
        description: >
          90, or 120 after extra time. The scheduled window, not the clock.
          Rates per 90 divide by min(minutes_played, this), so stoppage time
          cannot masquerade as variation.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [90, 120]
      - name: is_eligible
        description: >
          minutes_played >= 30, the sample floor for comparing players. A column
          rather than a filter, so the mart keeps every row and the analysis
          decides. Null where minutes are unknown. Says nothing about whether the
          minutes are trustworthy — see match_has_missing_substitution. Override
          with --vars eligible_minutes.

      # Counts are never null. A player who did none of something did none of
      # it; null would claim we do not know. Only the rates below are nullable.
      - name: actions
        data_tests: [not_null]
      - name: passes
        description: >
          Every pass credited to the player, goal kicks included — the pass was
          played whether or not Wyscout scored it.
        data_tests: [not_null]
      - name: passes_with_outcome
        description: >
          The pass_completion_pct denominator: passes Wyscout tagged, plus short
          goal kicks whose outcome we infer. Below `passes` by the long goal kicks.
        data_tests: [not_null]
      - name: passes_completed
        description: Recorded completions plus inferred ones, over the same set.
        data_tests: [not_null]
      - name: passes_unjudged
        description: >
          Long goal kicks. Wyscout never tags a goal kick for accuracy and a
          contested long ball is not safely inferable, so they are counted but
          not rated.
        data_tests: [not_null]
      - name: passes_outcome_inferred
        description: >
          How much of passes_completed is derived rather than recorded — short
          goal kicks only. Subtract it to get the recorded-only figure.
        data_tests: [not_null]
      - name: pass_completion_pct
        description: >
          passes_completed / passes_with_outcome. Null where nothing was judged,
          so "did not pass" stays distinct from "passed and never completed".
      - name: crosses
        description: >
          Counted from the qualifier list, not pass_type — that column keeps
          only the last qualifier and shows 26,444 crosses where there are
          62,169.
        data_tests: [not_null]
      - name: interceptions
        description: >
          Every interception, whichever event kloppy built it from. Deliberately
          a different set from defensive_actions.
        data_tests: [not_null]
      - name: defensive_actions
        description: >
          Tackles, interceptions and clearances, per the spec definition, with an
          interception recorded as a clearance counted once rather than twice.
        data_tests: [not_null]
      - name: defensive_action_success_pct
        description: >
          Share of defensive actions Wyscout scored that succeeded. Nothing here
          is inferred.
      - name: touches_in_defensive_third
        description: Actions starting at x < 1/3, with x towards the attacked goal.
        data_tests: [not_null]
      - name: defensive_actions_in_defensive_third
        description: >
          Of defensive_actions, how many also count towards
          touches_in_defensive_third.
        data_tests: [not_null]
      - name: attempts_beyond_halfway
        description: >
          Actions starting past the halfway line. Only meaningful for
          goalkeepers, where it detects Wyscout's mirrored coordinates.
        data_tests: [not_null]
      - name: has_mirrored_positions
        description: >
          True where a goalkeeper has four or more actions beyond halfway —
          Wyscout recorded them in the opposing frame, so x is wrong rather than
          missing. Not repairable; exclude the row from x-based metrics. Five
          player-matches. Undetectable for outfield players.
        data_tests: [not_null]
      - name: mean_action_x
        description: >
          Mean starting x over the player's actions that have a position, 0 own
          goal-line to 1 opponent's. Goal kicks carry a corner-flag sentinel
          rather than a position and are excluded.
      - name: attempts_with_position
        description: mean_action_x's denominator, exposed so it can be recomputed exactly.
        data_tests: [not_null]
      - name: sum_start_x_in_defensive_third
        description: >
          Sum of start x over touches_in_defensive_third, coalesced to 0 like
          the other counts.
        data_tests: [not_null]
