version: 2

sources:
  # FIS_DATA_DIR moves the warehouse elsewhere; fis.paths.data_dir() reads the
  # same variable. The './data' fallback resolves the same way because dbt
  # always runs from the repository root -- see profiles.yml.
  - name: wyscout
    description: >
      Everything published by Wyscout for this dataset. The events arrive as
      per-match parquet because kloppy has to decode them first; the dimensions
      are read as published. Different formats, one provenance -- we transcoded
      the events, we did not originate any of these facts.
      Every wyId is an identifier assigned by Wyscout.
    meta:
      external_location: "read_json_auto('{{ env_var('FIS_DATA_DIR', 'data') }}/json/{name}.json')"
    tables:
      - name: events
        meta:
          # union_by_name because 72 of the 1941 files have no card_type column:
          # kloppy only emits it when a card occurred. Without this, any query
          # touching that column fails with "schema mismatch in glob".
          external_location: "read_parquet('{{ env_var('FIS_DATA_DIR', 'data') }}/parquet/{name}_*.parquet', union_by_name=true)"
        data_tests: [not_empty]
        description: '{{ doc("wyscout_events") }}'
        columns:
          - name: match_id
            description: Wyscout match id. Joins to wyscout.matches.wyId.
            data_tests: [not_null]

      - name: matches
        data_tests: [not_empty]
        description: '{{ doc("wyscout_matches") }} Glob across the per-league files; union_by_name because groupName appears only in tournament files.'
        meta:
          external_location: "read_json_auto('{{ env_var('FIS_DATA_DIR', 'data') }}/json/matches_*.json', union_by_name=true)"
        columns:
          - name: wyId
            description: Match id. Joins to raw.events.match_id.
            data_tests: [unique, not_null]
          - name: teamsData
            description: >
              MAP keyed by team id, each value holding side, score, coachId and
              the formation with lineup and bench arrays. Unnested in staging.
          - name: referees
            description: >
              Array of {refereeId, role}, role being referee, firstAssistant,
              secondAssistant or fourthOfficial. The officials lens starts here.
          - name: competitionId
            description: Joins to wyscout.competitions.wyId.
            data_tests: [not_null]

      - name: players
        data_tests: [not_empty]
        description: '{{ doc("wyscout_players") }}'
        columns:
          - name: wyId
            data_tests: [unique, not_null]
          - name: role
            description: STRUCT of code2, code3 and name, e.g. GK / Goalkeeper.

      - name: teams
        data_tests: [not_empty]
        description: '{{ doc("wyscout_teams") }}'
        columns:
          - name: wyId
            data_tests: [unique, not_null]

      - name: competitions
        data_tests: [not_empty]
        description: '{{ doc("wyscout_competitions") }}'
        columns:
          - name: wyId
            data_tests: [unique, not_null]

      - name: referees
        data_tests: [not_empty]
        description: '{{ doc("wyscout_referees") }}'
        columns:
          - name: wyId
            data_tests: [unique, not_null]

      - name: coaches
        data_tests: [not_empty]
        description: '{{ doc("wyscout_coaches") }}'
        columns:
          - name: wyId
            data_tests: [unique, not_null]

      - name: eventid2name
        data_tests: [not_empty]
        description: eventId and subEventId to their labels. CSV, not JSON.
        meta:
          external_location: "read_csv_auto('{{ env_var('FIS_DATA_DIR', 'data') }}/json/{name}.csv')"
        columns:
          - name: event
            data_tests: [not_null]
      - name: tags2name
        data_tests: [not_empty]
        description: >
          Tag id to label and description, e.g. 1802 is "not accurate".
          CSV, not JSON.
        meta:
          external_location: "read_csv_auto('{{ env_var('FIS_DATA_DIR', 'data') }}/json/{name}.csv')"
        columns:
          - name: Tag
            data_tests: [unique, not_null]
