version: 2

sources:
  # Set FIS_DATA_DIR to point the warehouse elsewhere; fis.paths.data_dir() reads
  # the same variable, so both move together.
  #
  # The 'data' fallback is not a second definition of where data lives. dbt can
  # only run from the repository root -- DBT_PROJECT_DIR, DBT_PROFILES_DIR and the
  # duckdb path in profiles.yml are all relative to the working directory -- and
  # from there './data' *is* fis.paths.data_dir(), which resolves to
  # <the directory holding pyproject.toml>/data. pixi always starts tasks in the
  # manifest directory, so this holds however you invoke them.
  - name: wyscout
    description: >
      Everything published by Wyscout for this dataset. The events arrive as
      per-match parquet because kloppy has to decode them first; the dimensions
      are read as published. Different formats, one provenance -- we transcoded
      the events, we did not originate any of these facts.
    meta:
      external_location: "read_json_auto('{{ env_var('FIS_DATA_DIR', 'data') }}/json/{name}.json')"
    tables:
      - name: events
        meta:
          external_location: "{{ env_var('FIS_DATA_DIR', 'data') }}/parquet/{name}_*.parquet"
        data_tests: [not_empty]
        description: >
          One row per event, decoded from Wyscout V2 JSON by kloppy. Two things
          differ from the published feed: coordinates are transformed to
          ACTION_EXECUTING_TEAM orientation, and match_id is added, because
          kloppy's frame covers a single match and carries no match id.
        columns:
          - name: match_id
            description: Wyscout match id. Joins to wyscout.matches.wyId.
            data_tests: [not_null]

      - name: matches
        data_tests: [not_empty]
        description: >
          One row per match: date, competition, venue, score, referee
          assignments, and per-team lineups. Glob across the per-league files;
          union_by_name because groupName appears only in tournament files.
        meta:
          external_location: "read_json_auto('{{ env_var('FIS_DATA_DIR', 'data') }}/json/matches_*.json', union_by_name=true)"
        columns:
          - name: wyId
            description: Match id. Joins to raw.events.match_id.
            data_tests: [unique, not_null]
          - name: teamsData
            description: >
              MAP keyed by team id, each value holding side, score, coachId and
              the formation with lineup and bench arrays. Unnested in staging.
          - name: referees
            description: >
              Array of {refereeId, role}, role being referee, firstAssistant,
              secondAssistant or fourthOfficial. The officials lens starts here.
          - name: competitionId
            description: Joins to wyscout.competitions.wyId.
            data_tests: [not_null]

      - name: players
        data_tests: [not_empty]
        description: Player identities, with role and position.
        columns:
          - name: wyId
            data_tests: [unique, not_null]
          - name: role
            description: STRUCT of code2, code3 and name, e.g. GK / Goalkeeper.

      - name: teams
        data_tests: [not_empty]
        description: Team lookup, club and national.
        columns:
          - name: wyId
            data_tests: [unique, not_null]

      - name: competitions
        data_tests: [not_empty]
        description: The seven competitions covered by the dataset.
        columns:
          - name: wyId
            data_tests: [unique, not_null]

      - name: referees
        data_tests: [not_empty]
        description: >
          Referee identities. Published truncated; the fetcher recovers all 627
          records and keeps the original as referees.as-published.json.
          10 officials referenced by matches have no entry here -- 95 of 7942
          assignments, so expect nulls when joining.
        columns:
          - name: wyId
            data_tests: [unique, not_null]

      - name: coaches
        data_tests: [not_empty]
        description: >
          Coach identities. 3 coaches referenced by matches have no entry
          here -- 13 of 3645 match sides.
        columns:
          - name: wyId
            data_tests: [unique, not_null]

      - name: eventid2name
        data_tests: [not_empty]
        description: eventId and subEventId to their labels. CSV, not JSON.
        meta:
          external_location: "read_csv_auto('{{ env_var('FIS_DATA_DIR', 'data') }}/json/{name}.csv')"
        columns:
          - name: event
            data_tests: [not_null]
      - name: tags2name
        data_tests: [not_empty]
        description: >
          Tag id to label and description, e.g. 1802 is "not accurate".
          CSV, not JSON.
        meta:
          external_location: "read_csv_auto('{{ env_var('FIS_DATA_DIR', 'data') }}/json/{name}.csv')"
        columns:
          - name: Tag
            data_tests: [unique, not_null]
