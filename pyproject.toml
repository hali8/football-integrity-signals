[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "football-integrity-signals"
version = "0.1.0"
description = "Match-integrity signal detection over Wyscout event data"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Sahal Yacoob", email = "46266234+hali8@users.noreply.github.com" },
]
license = { text = "MIT" }
keywords = ["football", "soccer", "wyscout", "event-data", "integrity"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "platformdirs>=4.0",
  "httpx>=0.27",
  # Narrow on purpose: the parser version determines the ingested output as much
  # as the pinned dataset commit does, and src/fis/ingest/kloppy_workarounds.py
  # is verified against 3.19.0 specifically. Widen only with the canary tests green.
  "kloppy>=3.19,<3.20",
  "pandas>=2.2",
  "pyarrow>=15",
]

[project.optional-dependencies]
warehouse = ["duckdb>=1.0", "dbt-core>=1.12,<2", "dbt-duckdb>=1.11,<2"]
analysis = [
  "numpy>=2.0",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "scikit-learn>=1.5",
  # Imported directly by baseline/heldout/injection_test. scikit-learn
  # happens to depend on it, but a direct import is a direct dependency.
  "joblib>=1.3",
]
dev = ["pytest>=8.0", "ruff==0.16.4", "pre-commit>=4.6"]

[project.urls]
Homepage = "https://github.com/sahalyacoob/football-integrity-signals"
Source = "https://github.com/sahalyacoob/football-integrity-signals"

[project.scripts]
fis-baseline = "fis.analysis.baseline:main"
fis-data-dir = "fis.paths:main"
fis-feature-sweep = "fis.analysis.feature_sweep:main"
fis-fetch = "fis.data.fetch:main"
fis-gen-dbt-docs = "fis.data.dbt_docs:main"
fis-ingest = "fis.ingest.run:main"
fis-injection-test = "fis.analysis.injection_test:main"
fis-report = "fis.analysis.report:main"
fis-sources = "fis.sources:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fis"]

[tool.hatch.build.targets.sdist]
include = ["src/fis", "warehouse", "README.md", "pyproject.toml"]

[tool.ruff]
# No `select`: the enforced rules are ruff's DEFAULT set for the PINNED version,
# which is why the version is pinned in three files and a test refuses to let
# them diverge. Bumping ruff therefore changes the gate deliberately -- the set
# went from 62 rules to 416 between 0.9 and 0.16 without anyone choosing it.
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exercises all 1941 matches; deselect with -m 'not slow'"]
