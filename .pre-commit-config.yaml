# Run on every commit via `pixi run hooks-install`, and on every push in CI
# (.github/workflows/ci.yml runs these same hooks, so the two cannot drift).
#
# Note there is no black hook: `ruff format` is a black-compatible formatter, and
# running both means two tools fighting over the same files.
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: detect-private-key
      # Belt and braces over .gitignore: the Wyscout dataset is ~255 MiB and must
      # never reach a commit.
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.1
    hooks:
      # Honours the nested src/fis/analysis/ruff.toml, so the stage-rule import
      # bans are enforced here too.
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.4.2
    hooks:
      - id: prettier
        # SQL is left to dbt/sqlfluff; prettier has no dbt-jinja support.
        types_or: [yaml, markdown, json]
        exclude: ^pixi\.lock$

  - repo: local
    hooks:
      # On PUSH, not commit: the report only matters once it is published, and
      # blocking every local commit on it would make SKIP= a reflex.
      - id: report-freshness
        name: published report matches the analysis code
        entry: python3 scripts/report_freshness.py
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
