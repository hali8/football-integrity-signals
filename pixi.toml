[workspace]
authors = ["Sahal Yacoob <46266234+hali8@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "football-integrity-signals"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
fetch = "fis-fetch-wyscout"
ingest = "fis-ingest-wyscout"
# dbt's relative paths resolve against the working directory; pixi always runs
# tasks from the manifest directory, which is the repository root.
dbt-debug = "dbt debug --project-dir warehouse --profiles-dir warehouse"
build = "dbt build --project-dir warehouse --profiles-dir warehouse"
# Includes the stage-rule import bans under src/fis/analysis/.
lint = "ruff check src"
# Run once per clone: installs .git/hooks/pre-commit.
hooks-install = "pre-commit install"
hooks = "pre-commit run --all-files"

[dependencies]
python = "3.12.*"
platformdirs = ">=4.0"
httpx = ">=0.27"
duckdb = ">=1.5.5,<2"
pandas = ">=3.0.5,<4"
numpy = ">=2.5.2,<3"
scipy = ">=1.18.0,<2"
pyarrow = ">=25.0.0,<26"
matplotlib = ">=3.11.1,<4"
pre-commit = ">=4.6.2,<5"

[pypi-dependencies]
football-integrity-signals = { path = ".", editable = true }
kloppy = ">=3.19.0, <4"
dbt-core = ">=1.12.3, <2"
dbt-duckdb = ">=1.11.0, <2"
