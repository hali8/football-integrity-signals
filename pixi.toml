[workspace]
authors = ["Sahal Yacoob <46266234+hali8@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "football-integrity-signals"
platforms = ["osx-arm64"]
version = "0.1.0"

[activation.env]
DBT_PROFILES_DIR = "warehouse"
DBT_PROJECT_DIR = "warehouse"

[tasks]
fetch = "fis-fetch && fis-gen-dbt-docs"
# Chained so `pixi run build` works on a fresh clone. All three are idempotent.
ingest = { cmd = "fis-ingest", depends-on = ["fetch"] }
# Discovery comes from [activation.env]; dbt's paths are relative to the working
# directory, and pixi runs tasks from the manifest directory.
dbt-debug = "dbt debug"
build = { cmd = "dbt build", depends-on = ["ingest"] }
dbt = "dbt"
# The WHOLE tree, as the hook and CI do -- `ruff check src` once passed while
# scripts/ was failing. Includes the stage-rule import bans under analysis/.
lint = "ruff check . && ruff format --check ."
# What CI will say, in one command: every hook over every file, then the tests.
check = { cmd = "pytest -m 'not slow'", depends-on = ["hooks"] }
# Run once per clone: installs .git/hooks/pre-commit.
hooks-install = "pre-commit install --hook-type pre-commit --hook-type pre-push"
hooks = "pre-commit run --all-files"
# The slow marker walks all 1941 matches; skip it for the quick loop.
test = "pytest -m 'not slow'"
test-all = "pytest"
# The tracked report is the OUTPUT of a canonical run, not a copy someone
# remembered to make. Re-renders from the stamped parquet, so it costs seconds
# and the stamp refuses results the current code did not produce.
publish = """fis-report --forest --jobs -1 \
  --census data/reports/census.parquet \
  --results data/reports/phase2.parquet \
  --collateral data/reports/collateral.parquet \
  --collateral data/reports/collateral-forest.parquet \
  --out results/phase2.md"""

[dependencies]
python = "3.12.*"
platformdirs = ">=4.0"
httpx = ">=0.27"
duckdb = ">=1.5.5,<2"
pandas = ">=3.0.5,<4"
numpy = ">=2.5.2,<3"
scipy = ">=1.18.0,<2"
pyarrow = ">=25.0.0,<26"
matplotlib = ">=3.11.1,<4"
scikit-learn = ">=1.5,<2"
joblib = ">=1.3"
# Pinned, and kept in step with pyproject.toml and .pre-commit-config.yaml by
# test_tooling_versions.py -- ruff's DEFAULT rule set is the gate here, and it
# grew from 62 rules to 416 between 0.9 and 0.16.
ruff = "==0.16.4"
pre-commit = ">=4.6.2,<5"
pytest = ">=9.1.1,<10"

[pypi-dependencies]
football-integrity-signals = { path = ".", editable = true }
# Kept in step with pyproject.toml: the workarounds are verified against 3.19.0.
kloppy = ">=3.19.0, <3.20"
dbt-core = ">=1.12.3, <2"
dbt-duckdb = ">=1.11.0, <2"
