[workspace]
authors = ["Sahal Yacoob <46266234+hali8@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "football-integrity-signals"
platforms = ["osx-arm64"]
version = "0.1.0"

[activation.env]
DBT_PROFILES_DIR = "warehouse"
DBT_PROJECT_DIR = "warehouse"

[tasks]
fetch = "fis-fetch-wyscout"
ingest = "fis-ingest-wyscout"
# Project and profile discovery come from [activation.env] above. Everything dbt
# reads is relative to the working directory, and pixi runs tasks from the
# manifest directory, so the repository root is always the working directory.
dbt-debug = "dbt debug"
build = "dbt build"
dbt = "dbt"
# Includes the stage-rule import bans under src/fis/analysis/.
lint = "ruff check src"
# Run once per clone: installs .git/hooks/pre-commit.
hooks-install = "pre-commit install"
hooks = "pre-commit run --all-files"
# The slow marker walks all 1941 matches; skip it for the quick loop.
test = "pytest -m 'not slow'"
test-all = "pytest"

[dependencies]
python = "3.12.*"
platformdirs = ">=4.0"
httpx = ">=0.27"
duckdb = ">=1.5.5,<2"
pandas = ">=3.0.5,<4"
numpy = ">=2.5.2,<3"
scipy = ">=1.18.0,<2"
pyarrow = ">=25.0.0,<26"
matplotlib = ">=3.11.1,<4"
pre-commit = ">=4.6.2,<5"
pytest = ">=9.1.1,<10"

[pypi-dependencies]
football-integrity-signals = { path = ".", editable = true }
# Kept in step with pyproject.toml: the workarounds are verified against 3.19.0.
kloppy = ">=3.19.0, <3.20"
dbt-core = ">=1.12.3, <2"
dbt-duckdb = ">=1.11.0, <2"
